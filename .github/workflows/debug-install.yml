name: "Debug runner install"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Runner info
        run: |
          cat /etc/os-release | head -3
          echo "PATH=$PATH"
          which -a install || true
          ls -l /usr/bin/install || true
          echo '--- version ---'
          install --version 2>&1 | head -3
          echo '--- check (exact prereq) ---'
          if install --version | grep GNU; then echo CHECK_OK; else echo CHECK_FAIL; fi
          echo '--- shell used by make ---'
          ls -l /bin/sh
