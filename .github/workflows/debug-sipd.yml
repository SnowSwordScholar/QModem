name: "Debug luci-app-qmodem-sipd"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Import Env
        run: cat qmodem/.github/workflows/x64_ipk_2410.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-x64_ipk_2410-${{ env.SDK_NAME }}-${{ hashFiles('.github/workflows/build-x64.yml') }}

      - name: Patch include path
        run: |
          sed -i 's#^include \.\./\.\./luci\.mk#include $(TOPDIR)/feeds/luci/luci.mk#' \
            "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"
          echo "== patched Makefile =="
          cat "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"

      - name: Diagnose index
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds update qmodem
          echo "== index entries mentioning sipd =="
          grep -i sipd feeds/qmodem.index || echo "none in index"
          echo "== index entries mentioning voip (control: known good) =="
          grep -i voip feeds/qmodem.index | head -5 || echo "none"
          echo "== direct make evaluation of the patched package =="
          make -s --no-print-directory -C feeds/qmodem/luci/luci-app-qmodem-sipd \
            TOPDIR="$(pwd)" 2>&1 | head -15
          echo "== direct make evaluation of the working neighbour =="
          make -s --no-print-directory -C feeds/qmodem/luci/luci-app-qmodem-voip \
            TOPDIR="$(pwd)" 2>&1 | head -15

      - name: Explicit install attempt
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds install -p qmodem luci-app-qmodem-sipd 2>&1 | tail -10
          ls -l package/feeds/qmodem/ | grep -i sipd || echo "not linked"
