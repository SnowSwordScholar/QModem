name: "Debug luci-app-qmodem-sipd"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Import Env
        run: cat qmodem/.github/workflows/x64_ipk_2410.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-x64_ipk_2410-${{ env.SDK_NAME }}-${{ hashFiles('.github/workflows/build-x64.yml') }}

      - name: Normalise Makefile
        run: |
          cat > "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile" <<'EOF'
include $(TOPDIR)/rules.mk

include ../../version.mk

LUCI_TITLE:=LuCI support for independent QModem SIP service
LUCI_DEPENDS:=+qmodem-sipd +luci-base
LUCI_PKGARCH:=all
PKG_VERSION:=$(QMODEM_VERSION)
PKG_RELEASE:=$(QMODEM_RELEASE)
PKG_LICENSE:=GPL-2.0-or-later

include $(TOPDIR)/feeds/luci/luci.mk
EOF

      - name: Compare index coverage
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds update qmodem >/dev/null 2>&1 || true
          echo "== total packages in index: $(grep -c '^Package:' feeds/qmodem.index)"
          echo "== which luci apps made it =="
          grep -A1 'Source-Makefile: feeds/qmodem/luci/' feeds/qmodem.index | grep '^Package:' || echo "NONE"
          echo "== filesystem check =="
          ls -ld feeds/qmodem/luci/luci-app-qmodem-sipd
          ls -l feeds/qmodem/luci/luci-app-qmodem-sipd/Makefile
          git -C "$GITHUB_WORKSPACE/qmodem" ls-files luci/luci-app-qmodem-sipd

      - name: Force-install and build
        continue-on-error: true
        run: |
          cd sdk
          ln -sfn ../../../feeds/qmodem/luci/luci-app-qmodem-sipd \
            package/feeds/qmodem/luci-app-qmodem-sipd
          ls -l package/feeds/qmodem/ | grep sipd
          echo "CONFIG_PACKAGE_luci-app-qmodem-sipd=m" >> .config
          yes "" | make oldconfig >/dev/null 2>&1 || true
          make package/luci-app-qmodem-sipd/compile -j1 V=s 2>&1 | tail -35
          echo "== result =="
          ls -l bin/packages/x86_64/qmodem/ | grep -i sipd || echo "no ipk"
