name: "Debug luci-app-qmodem-sipd"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Import Env
        run: cat qmodem/.github/workflows/x64_ipk_2410.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-x64_ipk_2410-${{ env.SDK_NAME }}-${{ hashFiles('.github/workflows/build-x64.yml') }}

      - name: Normalise Makefile
        run: |
          M="$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"
          {
            echo 'include $(TOPDIR)/rules.mk'
            echo ''
            echo 'include ../../version.mk'
            echo ''
            echo 'LUCI_TITLE:=LuCI support for independent QModem SIP service'
            echo 'LUCI_DEPENDS:=+qmodem-sipd +luci-base'
            echo 'LUCI_PKGARCH:=all'
            echo 'PKG_VERSION:=$(QMODEM_VERSION)'
            echo 'PKG_RELEASE:=$(QMODEM_RELEASE)'
            echo 'PKG_LICENSE:=GPL-2.0-or-later'
            echo ''
            echo 'include $(TOPDIR)/feeds/luci/luci.mk'
          } > "$M"
          cat "$M"

      - name: Compare index coverage
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds update qmodem >/dev/null 2>&1 || true
          echo "== total packages: $(grep -c '^Package:' feeds/qmodem.index)"
          echo "== luci apps that made it into the index =="
          grep -A1 'Source-Makefile: feeds/qmodem/luci/' feeds/qmodem.index | grep '^Package:' || echo "NONE"
          echo "== filesystem check =="
          ls -ld feeds/qmodem/luci/luci-app-qmodem-sipd
          git -C "$GITHUB_WORKSPACE/qmodem" ls-files luci/luci-app-qmodem-sipd

      - name: Force-install and build
        continue-on-error: true
        run: |
          cd sdk
          ln -sfn ../../../feeds/qmodem/luci/luci-app-qmodem-sipd \
            package/feeds/qmodem/luci-app-qmodem-sipd
          ls -l package/feeds/qmodem/ | grep sipd
          make package/luci-app-qmodem-sipd/compile -j1 V=s 2>&1 | tail -35
          echo "== result =="
          ls -l bin/packages/x86_64/qmodem/ | grep -i sipd || echo "no ipk"
