name: "Debug luci-app-qmodem-sipd"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Import Env
        run: cat qmodem/.github/workflows/x64_ipk_2410.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-x64_ipk_2410-${{ env.SDK_NAME }}-${{ hashFiles('.github/workflows/build-x64.yml') }}

      - name: Build as-is verbose
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem
          make package/luci-app-qmodem-sipd/compile -j1 V=s 2>&1 | tail -40

      - name: Patch include path and rebuild verbose
        continue-on-error: true
        run: |
          sed -i 's#^include \.\./\.\./luci\.mk#include $(TOPDIR)/feeds/luci/luci.mk#' \
            "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem
          echo "== installed? =="
          ls -l package/feeds/qmodem/ | grep -i sipd || echo "still not installed"
          make package/luci-app-qmodem-sipd/compile -j1 V=s 2>&1 | tail -60
          echo "== result =="
          ls bin/packages/x86_64/qmodem/ | grep -i sipd || echo "no ipk"
