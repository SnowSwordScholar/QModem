name: "Debug luci-app-qmodem-sipd"

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Import Env
        run: cat qmodem/.github/workflows/x64_ipk_2410.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-x64_ipk_2410-${{ env.SDK_NAME }}-${{ hashFiles('.github/workflows/build-x64.yml') }}

      # Same shape as every other luci app in this repo: version.mk include
      # plus explicit PKG_VERSION / PKG_RELEASE.
      - name: Rewrite Makefile to standard shape
        run: |
          cat > "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk

          include ../../version.mk

          LUCI_TITLE:=LuCI support for independent QModem SIP service
          LUCI_DEPENDS:=+qmodem-sipd +luci-base
          LUCI_PKGARCH:=all
          PKG_VERSION:=$(QMODEM_VERSION)
          PKG_RELEASE:=$(QMODEM_RELEASE)
          PKG_LICENSE:=GPL-2.0-or-later

          include $(TOPDIR)/feeds/luci/luci.mk
          EOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"
          echo "== new Makefile =="
          cat "$GITHUB_WORKSPACE/qmodem/luci/luci-app-qmodem-sipd/Makefile"

      - name: Install from feed
        continue-on-error: true
        run: |
          cd sdk
          ./scripts/feeds update qmodem
          echo "== index =="
          grep -i sipd feeds/qmodem.index || echo "none in index"
          ./scripts/feeds install -a -p qmodem 2>&1 | tail -5
          ls -l package/feeds/qmodem/ | grep -i sipd || echo "not linked"

      - name: Build
        continue-on-error: true
        run: |
          cd sdk
          make package/luci-app-qmodem-sipd/compile -j1 V=s 2>&1 | tail -30
          echo "== result =="
          ls bin/packages/x86_64/qmodem/ | grep -i sipd || echo "no ipk"
